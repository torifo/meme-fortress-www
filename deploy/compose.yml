services:
  app:
    image: ghcr.io/torifo/meme-fortress:latest
    container_name: meme-fortress
    restart: unless-stopped
    networks:
      - default
      - global-proxy-network
    expose:
      - "8787"
    volumes:
      - data:/app/data
    environment:
      - RUST_LOG=info
      # nginx-proxy / acme-companion auto-routing
      - VIRTUAL_HOST=meme-fortress-www.riumu.net
      - VIRTUAL_PORT=8787
      - LETSENCRYPT_HOST=meme-fortress-www.riumu.net
      - LETSENCRYPT_EMAIL=akito.shoji@geniee.co.jp

networks:
  global-proxy-network:
    external: true

volumes:
  data:
