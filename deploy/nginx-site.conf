# /etc/nginx/sites-available/meme-fortress-www.riumu.net
# 有効化: sudo ln -s /etc/nginx/sites-available/meme-fortress-www.riumu.net /etc/nginx/sites-enabled/
# certbot --nginx -d meme-fortress-www.riumu.net 実行後、443 ブロックは自動で追記される

server {
    listen 80;
    listen [::]:80;
    server_name meme-fortress-www.riumu.net;

    # certbot 用の challenge を許可。それ以外は https にリダイレクト（certbot が後で追記する）
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 大きめのレスポンス対応（seed JSON など）
    client_max_body_size 5m;
}
