<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MEME FORTRESS — 図書館</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- =====================================================
    Google Apps Script の設定方法:
    1. script.google.com で新規スクリプトを作成
    2. 以下のコードを貼り付けて保存:

    function doPost(e) {
      const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('votes')
                    || SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
      const data = JSON.parse(e.postData.contents);
      sheet.appendRow([new Date(), data.meme_id, data.action, data.meme_name, data.era]);
      return ContentService.createTextOutput(JSON.stringify({status:'ok'}))
        .setMimeType(ContentService.MimeType.JSON);
    }

    3. デプロイ → 新しいデプロイ → ウェブアプリ
    4. アクセス：「全員」に設定してデプロイ
    5. 発行URLを下の APPS_SCRIPT_URL に貼り付ける
  ====================================================== -->

  <style>
    :root {
      --bg: #080808;
      --bg2: #0f0f0f;
      --card-bg: #f4efe4;
      --card-bg2: #ede8dc;
      --card-text: #111;
      --card-sub: #555;
      --card-border: #d4cdc0;
      --accept: #1aff8c;
      --reject: #ff2d55;
      --accent: #e8ff00;
      --accent2: #00d4ff;
      --dim: #333;
      --dim2: #222;
      --text: #e8e8e8;
      --text-dim: #666;
      --border: #1e1e1e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', 'Noto Sans JP', monospace;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
    }

    /* ─── SCANLINE OVERLAY ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.08) 2px,
        rgba(0,0,0,.08) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* ─── LAYOUT ─── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    /* ─── HEADER ─── */
    header {
      padding: 16px 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Zen Dots', monospace;
      font-size: 18px;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(232,255,0,0.4);
    }

    .logo span {
      color: var(--text-dim);
      font-size: 11px;
      display: block;
      letter-spacing: 0.15em;
      font-family: 'IBM Plex Mono', monospace;
    }

    .counter {
      text-align: right;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .counter strong {
      color: var(--accent);
      font-size: 22px;
      font-family: 'Zen Dots', monospace;
      display: block;
      line-height: 1;
    }

    /* ─── PROGRESS BAR ─── */
    .progress-wrap {
      padding: 10px 20px 0;
      flex-shrink: 0;
    }

    .progress-bar {
      height: 2px;
      background: var(--dim);
      border-radius: 1px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.3s ease;
      box-shadow: 0 0 8px rgba(232,255,0,0.6);
    }

    /* ─── CARD STACK ─── */
    .card-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 12px 20px;
      overflow: hidden;
    }

    .card-stack {
      position: relative;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 3/4.2;
    }

    /* Background phantom cards */
    .card-phantom {
      position: absolute;
      inset: 0;
      background: var(--card-bg2);
      border-radius: 16px;
      border: 1px solid var(--card-border);
    }

    .card-phantom:nth-child(1) {
      transform: translateY(10px) scale(0.94);
      opacity: 0.5;
      z-index: 1;
    }

    .card-phantom:nth-child(2) {
      transform: translateY(5px) scale(0.97);
      opacity: 0.7;
      z-index: 2;
    }

    /* Main draggable card */
    .card {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      z-index: 10;
      cursor: grab;
      will-change: transform;
      transition: box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .card:active { cursor: grabbing; }

    .card.is-dragging {
      transition: none !important;
    }

    .card.animate-right {
      animation: flyRight 0.4s ease-in forwards;
    }

    .card.animate-left {
      animation: flyLeft 0.4s ease-in forwards;
    }

    .card.snap-back {
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    }

    @keyframes flyRight {
      to { transform: translateX(140%) rotate(20deg); opacity: 0; }
    }
    @keyframes flyLeft {
      to { transform: translateX(-140%) rotate(-20deg); opacity: 0; }
    }

    /* ─── CARD OVERLAYS ─── */
    .overlay-accept, .overlay-reject {
      position: absolute;
      inset: 0;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Zen Dots', monospace;
      font-size: 36px;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.1s;
    }

    .overlay-accept {
      background: rgba(26,255,140,0.12);
      border: 3px solid var(--accept);
      color: var(--accept);
      text-shadow: 0 0 20px var(--accept);
      box-shadow: inset 0 0 40px rgba(26,255,140,0.1), 0 0 30px rgba(26,255,140,0.2);
    }

    .overlay-reject {
      background: rgba(255,45,85,0.12);
      border: 3px solid var(--reject);
      color: var(--reject);
      text-shadow: 0 0 20px var(--reject);
      box-shadow: inset 0 0 40px rgba(255,45,85,0.1), 0 0 30px rgba(255,45,85,0.2);
    }

    .stamp-text {
      transform: rotate(-15deg);
      text-align: center;
      line-height: 1.3;
    }

    .stamp-text small {
      display: block;
      font-size: 11px;
      letter-spacing: 0.2em;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 400;
    }

    /* ─── CARD HEADER ─── */
    .card-header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .era-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      font-weight: 600;
      flex-shrink: 0;
    }

    .era-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    /* Era color variants */
    .era-flash     { background: rgba(255,107,53,.15); color: #ff8c5a; border: 1px solid rgba(255,107,53,.3); }
    .era-nico-e    { background: rgba(155,89,182,.15); color: #c39bd3; border: 1px solid rgba(155,89,182,.3); }
    .era-nico-l    { background: rgba(52,152,219,.15); color: #7fb3d3; border: 1px solid rgba(52,152,219,.3); }
    .era-news      { background: rgba(231,76,60,.15);  color: #f1948a; border: 1px solid rgba(231,76,60,.3); }
    .era-twitter   { background: rgba(29,161,242,.15); color: #5dade2; border: 1px solid rgba(29,161,242,.3); }
    .era-heisei    { background: rgba(39,174,96,.15);  color: #7dcea0; border: 1px solid rgba(39,174,96,.3); }
    .era-tiktok    { background: rgba(255,0,80,.15);   color: #ff5c8a; border: 1px solid rgba(255,0,80,.3); }
    .era-stills    { background: rgba(243,156,18,.15); color: #f0b429; border: 1px solid rgba(243,156,18,.3); }
    .era-future    { background: rgba(0,212,255,.15);  color: #4dd9f0; border: 1px solid rgba(0,212,255,.3); }
    .era-other     { background: rgba(149,165,166,.15);color: #aab7b8; border: 1px solid rgba(149,165,166,.3); }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .region-badge {
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em;
      padding: 3px 8px;
      border-radius: 3px;
      border: 1px solid;
    }

    .region-jp {
      color: #f0b429;
      border-color: rgba(240,180,41,.3);
      background: rgba(240,180,41,.08);
    }

    .region-global {
      color: #4dd9f0;
      border-color: rgba(77,217,240,.3);
      background: rgba(77,217,240,.08);
    }

    /* ─── CARD BODY ─── */
    .card-body {
      flex: 1;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .meme-title {
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 900;
      font-size: clamp(16px, 4.5vw, 22px);
      color: var(--card-text);
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .meme-title-en {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      color: var(--card-sub);
      letter-spacing: 0.05em;
      font-style: italic;
      margin-top: 2px;
    }

    .divider {
      height: 1px;
      background: var(--card-border);
      flex-shrink: 0;
    }

    .meme-year {
      font-family: 'Zen Dots', monospace;
      font-size: 11px;
      color: var(--card-sub);
      letter-spacing: 0.1em;
    }

    .meme-desc {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      color: #3a3a3a;
      line-height: 1.65;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }

    .tag {
      font-size: 9px;
      padding: 3px 7px;
      border-radius: 3px;
      background: rgba(0,0,0,.06);
      color: #666;
      border: 1px solid rgba(0,0,0,.08);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.04em;
    }

    /* ─── CARD FOOTER ─── */
    .card-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-num {
      font-size: 9px;
      color: var(--card-sub);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em;
    }

    .platform-list {
      display: flex;
      gap: 5px;
    }

    .platform-pill {
      font-size: 8px;
      padding: 2px 5px;
      border-radius: 2px;
      border: 1px solid rgba(0,0,0,.1);
      color: #888;
      font-family: 'IBM Plex Mono', monospace;
    }

    /* ─── DRAG HINT ─── */
    .drag-hint {
      display: flex;
      justify-content: space-between;
      padding: 4px 20px;
      flex-shrink: 0;
    }

    .drag-hint-left, .drag-hint-right {
      font-size: 10px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 5px;
      opacity: 0.5;
    }

    .drag-hint-left { color: var(--reject); }
    .drag-hint-right { color: var(--accept); }

    /* ─── ACTION BUTTONS ─── */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 0px 20px 18px;
      flex-shrink: 0;
    }

    .btn-action {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-action:active {
      transform: scale(0.9);
    }

    .btn-skip {
      border-color: var(--reject);
      color: var(--reject);
    }

    .btn-skip:hover {
      background: rgba(255,45,85,.1);
      box-shadow: 0 0 20px rgba(255,45,85,.3);
    }

    .btn-collect {
      border-color: var(--accept);
      color: var(--accept);
      width: 70px;
      height: 70px;
    }

    .btn-collect:hover {
      background: rgba(26,255,140,.1);
      box-shadow: 0 0 20px rgba(26,255,140,.3);
    }

    .btn-label {
      font-size: 9px;
      font-family: 'IBM Plex Mono', monospace;
      text-align: center;
      margin-top: 5px;
      letter-spacing: 0.1em;
    }

    .btn-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .btn-wrap .btn-label { color: var(--text-dim); }
    .btn-wrap:has(.btn-skip) .btn-label { color: rgba(255,45,85,.6); }
    .btn-wrap:has(.btn-collect) .btn-label { color: rgba(26,255,140,.6); }

    /* ─── KEYBOARD HINT ─── */
    .keyboard-hint {
      text-align: center;
      font-size: 9px;
      color: var(--dim);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.12em;
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    .key {
      display: inline-block;
      border: 1px solid var(--dim);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 9px;
      color: var(--text-dim);
    }

    /* ─── EMPTY STATE ─── */
    #done-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      padding: 20px;
    }

    .done-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .done-header h1 {
      font-family: 'Zen Dots', monospace;
      font-size: 24px;
      color: var(--accent);
      text-shadow: 0 0 30px rgba(232,255,0,.4);
      margin-bottom: 4px;
    }

    .done-header p {
      font-size: 11px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.1em;
    }

    .done-stats {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 24px;
    }

    .stat-box {
      text-align: center;
      padding: 12px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg2);
    }

    .stat-box .num {
      font-family: 'Zen Dots', monospace;
      font-size: 28px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(232,255,0,.4);
      display: block;
    }

    .stat-box .label {
      font-size: 9px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.12em;
      margin-top: 2px;
    }

    .library-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .library-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }

    .library-item:hover {
      border-color: rgba(232,255,0,.3);
    }

    .library-item-name {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-item-en {
      font-size: 9px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-item-year {
      font-family: 'Zen Dots', monospace;
      font-size: 9px;
      color: var(--accent);
      margin-top: 4px;
      display: block;
    }

    .btn-retry {
      display: block;
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-family: 'Zen Dots', monospace;
      font-size: 14px;
      letter-spacing: 0.1em;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, box-shadow 0.2s;
      margin-bottom: 8px;
    }

    .btn-retry:hover {
      background: rgba(232,255,0,.1);
      box-shadow: 0 0 20px rgba(232,255,0,.2);
    }

    /* ─── LOADING ─── */
    #loading {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }

    .loading-title {
      font-family: 'Zen Dots', monospace;
      font-size: 20px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(232,255,0,.5);
    }

    .loading-sub {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.2em;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      letter-spacing: 0.08em;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      z-index: 200;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.accept { border-color: rgba(26,255,140,.4); color: var(--accept); }
    .toast.reject { border-color: rgba(255,45,85,.4); color: var(--reject); }

    /* ─── SECTION HEADER (done screen) ─── */
    .section-header {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      font-family: 'IBM Plex Mono', monospace;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .empty-library {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="loading-title">MEME FORTRESS</div>
  <div class="loading-sub">LOADING ARCHIVES...</div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo">
      MEME FORTRESS
      <span>// 図書館選別システム</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <button id="btn-stop" title="中断して結果を見る" style="
        background:transparent;border:1px solid var(--dim);border-radius:5px;
        color:var(--text-dim);font-family:'IBM Plex Mono',monospace;font-size:9px;
        letter-spacing:.1em;padding:5px 10px;cursor:pointer;transition:border-color .2s,color .2s;
      ">■ 中断</button>
      <div class="counter">
        <strong id="remaining">0</strong>
        REMAINING
      </div>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <div class="card-area" id="card-area">
    <div class="card-stack" id="card-stack">
      <!-- Phantom cards (decorative) -->
      <div class="card-phantom"></div>
      <div class="card-phantom"></div>
      <!-- Real card injected by JS -->
    </div>
  </div>

  <div class="drag-hint">
    <div class="drag-hint-left">← SKIP</div>
    <div class="drag-hint-right">COLLECT →</div>
  </div>

  <div class="action-bar">
    <div class="btn-wrap">
      <button class="btn-action btn-skip" id="btn-skip" aria-label="スキップ">✕</button>
      <div class="btn-label">SKIP</div>
    </div>
    <div class="btn-wrap">
      <button class="btn-action btn-collect" id="btn-collect" aria-label="図書館に入れる">◯</button>
      <div class="btn-label">COLLECT</div>
    </div>
  </div>

  <div class="keyboard-hint">
    <span class="key">←</span> SKIP &nbsp;|&nbsp; <span class="key">→</span> COLLECT
  </div>
</div>

<div id="done-screen">
  <div class="done-header">
    <h1 id="done-title">ARCHIVE COMPLETE</h1>
    <p id="done-sub">あなたの図書館が完成しました</p>
  </div>

  <div class="done-stats">
    <div class="stat-box">
      <span class="num" id="stat-collected">0</span>
      <div class="label">COLLECTED</div>
    </div>
    <div class="stat-box">
      <span class="num" id="stat-skipped">0</span>
      <div class="label">SKIPPED</div>
    </div>
    <div class="stat-box">
      <span class="num" id="stat-total">0</span>
      <div class="label">TOTAL</div>
    </div>
  </div>

  <div class="section-header">// あなたの収集ミーム一覧</div>

  <div class="library-grid" id="library-grid"></div>

  <button class="btn-retry" id="btn-retry">RESTART ARCHIVE</button>
  <button class="btn-retry" id="btn-share" style="border-color:var(--accent2);color:var(--accent2)">COPY RESULT</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
<script>
// ═══════════════════════════════════════════════════
// CONFIG — Google Apps ScriptのURLをここに貼る
// ═══════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/a/macros/geniee.co.jp/s/AKfycbxdFUwOkwyunvfPA8JuwqWYsYFpsA3PJVO7Ida30faaEPQNE1ohaa5aUHBuBaSh1deA/exec';

// ═══════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════
let memes = [];
let currentIndex = 0;
let library = [];
let skippedList = [];
let isDragging = false;
let startX = 0;
let currentX = 0;
const SWIPE_THRESHOLD = 90;

// ═══════════════════════════════════════════════════
// ERA → CSS CLASS MAPPING
// ═══════════════════════════════════════════════════
const ERA_CLASS = {
  'フラッシュ倉庫時代': 'era-flash',
  'ニコニコ動画時代前期': 'era-nico-e',
  'ニコニコ動画時代後期': 'era-nico-l',
  '時事ニュースネットミームバブル': 'era-news',
  'Twitter時代ネットミーム戦国時代': 'era-twitter',
  '平成終期〜令和の幕開け': 'era-heisei',
  'TikTok時代': 'era-tiktok',
  '静止画大喜利ミーム時代': 'era-stills',
  'TikTok時代以降': 'era-future',
  'Twitter時代以前': 'era-other',
};

// ═══════════════════════════════════════════════════
// LOAD
// ═══════════════════════════════════════════════════
async function init() {
  try {
    const res = await fetch('./memes_seed.json');
    const data = await res.json();
    memes = shuffle(data.memes);

    // Restore library from localStorage
    const saved = localStorage.getItem('meme-fortress-library');
    if (saved) library = JSON.parse(saved);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('stat-total').textContent = memes.length;
    renderCurrentCard();
    updateProgress();
  } catch (e) {
    document.querySelector('.loading-sub').textContent = 'ERROR: ' + e.message;
  }
}

// ═══════════════════════════════════════════════════
// RENDER CARD
// ═══════════════════════════════════════════════════
function renderCurrentCard() {
  const stack = document.getElementById('card-stack');

  // Remove existing card
  const old = stack.querySelector('.card');
  if (old) old.remove();

  if (currentIndex >= memes.length) {
    showDoneScreen();
    return;
  }

  const meme = memes[currentIndex];
  const card = buildCard(meme, currentIndex);
  stack.appendChild(card);
  setupCardInteraction(card);
}

function buildCard(meme, idx) {
  const eraClass = ERA_CLASS[meme.era] || 'era-other';
  const regionClass = (meme.region === 'JP') ? 'region-jp' : 'region-global';
  const regionLabel = (meme.region === 'JP') ? '🇯🇵 JP' : '🌐 GLOBAL';

  const tagHtml = (meme.tags || []).slice(0, 5).map(t =>
    `<span class="tag">${t}</span>`
  ).join('');

  const platforms = (meme.platform || []).slice(0, 3);
  const platformHtml = platforms.map(p =>
    `<span class="platform-pill">${p}</span>`
  ).join('');

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = meme.id;
  card.innerHTML = `
    <div class="overlay-accept">
      <div class="stamp-text">◯<small>COLLECT</small></div>
    </div>
    <div class="overlay-reject">
      <div class="stamp-text">✕<small>SKIP</small></div>
    </div>

    <div class="card-header">
      <span class="era-badge ${eraClass}">${meme.era || 'その他'}</span>
      <div class="card-badges">
        <span class="region-badge ${regionClass}">${regionLabel}</span>
      </div>
    </div>

    <div class="card-body">
      <div>
        <div class="meme-title">${meme.name}</div>
        ${meme.name_en ? `<div class="meme-title-en">${meme.name_en}</div>` : ''}
      </div>

      <div class="divider"></div>
      <div class="meme-year">${meme.year ? meme.year + ' 年' : '年不明'}</div>

      <div class="meme-desc">${meme.description}</div>

      <div class="card-tags">${tagHtml}</div>
    </div>

    <div class="card-footer">
      <span class="card-num">#${String(idx + 1).padStart(3, '0')} / ${memes.length}</span>
      <div class="platform-list">${platformHtml}</div>
    </div>
  `;

  return card;
}

// ═══════════════════════════════════════════════════
// INTERACTION — Hammer.js + keyboard
// ═══════════════════════════════════════════════════
function setupCardInteraction(card) {
  const mc = new Hammer.Manager(card);
  mc.add(new Hammer.Pan({ direction: Hammer.DIRECTION_HORIZONTAL, threshold: 5 }));

  mc.on('panstart', () => {
    card.classList.add('is-dragging');
    isDragging = true;
  });

  mc.on('panmove', (e) => {
    if (!isDragging) return;
    const dx = e.deltaX;
    const rotate = dx * 0.08;
    card.style.transform = `translateX(${dx}px) rotate(${rotate}deg)`;

    const progress = Math.min(Math.abs(dx) / SWIPE_THRESHOLD, 1);
    const acceptEl = card.querySelector('.overlay-accept');
    const rejectEl = card.querySelector('.overlay-reject');

    if (dx > 0) {
      acceptEl.style.opacity = progress;
      rejectEl.style.opacity = 0;
    } else {
      rejectEl.style.opacity = progress;
      acceptEl.style.opacity = 0;
    }
  });

  mc.on('panend', (e) => {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('is-dragging');

    if (e.deltaX > SWIPE_THRESHOLD) {
      triggerCollect(card);
    } else if (e.deltaX < -SWIPE_THRESHOLD) {
      triggerSkip(card);
    } else {
      // Snap back
      card.classList.add('snap-back');
      card.style.transform = '';
      card.querySelector('.overlay-accept').style.opacity = 0;
      card.querySelector('.overlay-reject').style.opacity = 0;
      setTimeout(() => card.classList.remove('snap-back'), 400);
    }
  });
}

function triggerCollect(card) {
  const meme = memes[currentIndex];
  card.classList.add('animate-right');
  card.querySelector('.overlay-accept').style.opacity = 1;
  vibrate(50);
  showToast('◯ 図書館に収録', 'accept');

  library.push(meme);
  localStorage.setItem('meme-fortress-library', JSON.stringify(library));
  submitVote(meme.id, 'collect', meme.name, meme.era);

  setTimeout(() => advance(), 380);
}

function triggerSkip(card) {
  const meme = memes[currentIndex];
  card.classList.add('animate-left');
  card.querySelector('.overlay-reject').style.opacity = 1;
  vibrate(20);
  showToast('✕ スキップ', 'reject');

  skippedList.push(meme);
  submitVote(meme.id, 'skip', meme.name, meme.era);

  setTimeout(() => advance(), 380);
}

function advance() {
  currentIndex++;
  updateProgress();
  renderCurrentCard();
}

// ═══════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════
document.addEventListener('keydown', (e) => {
  if (currentIndex >= memes.length) return;
  const card = document.querySelector('.card');
  if (!card) return;

  if (e.key === 'ArrowRight' || e.key === 'l') triggerCollect(card);
  if (e.key === 'ArrowLeft' || e.key === 'h') triggerSkip(card);
});

// ─── Buttons ───
document.getElementById('btn-skip').addEventListener('click', () => {
  const card = document.querySelector('.card');
  if (card) triggerSkip(card);
});

document.getElementById('btn-collect').addEventListener('click', () => {
  const card = document.querySelector('.card');
  if (card) triggerCollect(card);
});

// ═══════════════════════════════════════════════════
// PROGRESS
// ═══════════════════════════════════════════════════
function updateProgress() {
  const pct = (currentIndex / memes.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('remaining').textContent = memes.length - currentIndex;
}

// ═══════════════════════════════════════════════════
// DONE SCREEN
// ═══════════════════════════════════════════════════
function showDoneScreen(interrupted = false) {
  document.getElementById('app').style.display = 'none';
  const done = document.getElementById('done-screen');
  done.style.display = 'flex';

  if (interrupted) {
    document.getElementById('done-title').textContent = 'PAUSED';
    document.getElementById('done-sub').textContent =
      `${currentIndex}/${memes.length} 件を選別 — 途中経過`;
    document.getElementById('btn-retry').textContent = 'RESUME';
    document.getElementById('btn-retry').dataset.resume = '1';
  } else {
    document.getElementById('done-title').textContent = 'ARCHIVE COMPLETE';
    document.getElementById('done-sub').textContent = 'あなたの図書館が完成しました';
    document.getElementById('btn-retry').textContent = 'RESTART ARCHIVE';
    delete document.getElementById('btn-retry').dataset.resume;
  }

  document.getElementById('stat-collected').textContent = library.length;
  document.getElementById('stat-skipped').textContent = skippedList.length;
  document.getElementById('stat-total').textContent = memes.length;

  const grid = document.getElementById('library-grid');
  grid.innerHTML = '';

  if (library.length === 0) {
    grid.innerHTML = '<div class="empty-library" style="grid-column:1/-1">収録なし</div>';
    return;
  }

  library.forEach(m => {
    const eraClass = ERA_CLASS[m.era] || 'era-other';
    const item = document.createElement('div');
    item.className = 'library-item';
    item.innerHTML = `
      <div class="library-item-name">${m.name}</div>
      <div class="library-item-en">${m.name_en || ''}</div>
      <span class="library-item-year">${m.year || '?'}年</span>
    `;
    grid.appendChild(item);
  });
}

// 中断ボタン
document.getElementById('btn-stop').addEventListener('click', () => {
  if (currentIndex >= memes.length) return;
  showDoneScreen(true);
});

// Retry
document.getElementById('btn-retry').addEventListener('click', () => {
  const isResume = document.getElementById('btn-retry').dataset.resume === '1';
  if (!isResume) {
    library = [];
    skippedList = [];
    currentIndex = 0;
    localStorage.removeItem('meme-fortress-library');
    memes = shuffle(memes);
  }
  document.getElementById('done-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderCurrentCard();
  updateProgress();
});

// Copy result
document.getElementById('btn-share').addEventListener('click', () => {
  const names = library.map(m => m.name).join('、');
  const text = `【MEME FORTRESS 図書館】\n収録: ${library.length}/${memes.length}件\n${names ? '収録ミーム: ' + names : ''}`;
  navigator.clipboard.writeText(text).then(() => showToast('📋 クリップボードにコピー', 'accept'));
});

// ═══════════════════════════════════════════════════
// GOOGLE SHEETS VOTE
// ═══════════════════════════════════════════════════
function submitVote(id, action, name, era) {
  if (!APPS_SCRIPT_URL) return;
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ meme_id: id, action, meme_name: name, era })
  }).catch(() => {});  // サイレント失敗
}

// ═══════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════
let toastTimer;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

// ═══════════════════════════════════════════════════
// VIBRATE
// ═══════════════════════════════════════════════════
function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── BOOT ───
init();
</script>
</body>
</html>
